# 测试环境配置
# 使用 H2 内存数据库，避免测试时依赖外部 MySQL
spring:
  datasource:
    url: jdbc:h2:mem:sec_test;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: false
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password:
      database: 0

# JWT 配置（测试用固定密钥，至少 256 位即 32 字符）
jwt:
  secret: abcdefghijklmnopqrstuvwxyz123456
  access-token-expire: 3600000

# MyBatis
mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.iwe3.sec.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# 日志
logging:
  level:
    com.iwe3.sec: DEBUG
