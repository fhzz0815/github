server:
  port: 8080
  shutdown: graceful
  servlet:
    context-path: /smart_restaurant
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  profiles:
    active: dev
  application:
    name: portal
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  lifecycle:
    timeout-per-shutdown-phase: 30s

  # Redis 单机配置（开发环境使用本地 Redis，未设置密码）
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password:
      database: 0
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 20
          max-wait: 3000ms
          max-idle: 10
          min-idle: 5

  # Druid 数据源
  datasource:
    druid:
      aop-patterns: com.iwe3.sec.controller.*Controller
      driver-class-name: com.mysql.cj.jdbc.Driver
      filter: stat,wall,slf4j
      filter.stat.enabled: true
      filter.stat.log-slow-sql: true
      filter.stat.slow-sql-millis: 2000
      filter.wall.enabled: true
      initial-size: 5
      max-active: 50
      max-pool-prepared-statement-per-connection-size: 50
      max-wait: 60000
      min-evictable-idle-time-millis: 300000
      min-idle: 5
      password: ${DB_PASSWORD:Flzx3qc_14yhl9t}
      pool-prepared-statements: true
      stat-view-servlet:
        allow-ips: 127.0.0.1,localhost
        enabled: true
        login-password: ${DRUID_PASSWORD:admin123}
        login-username: admin
        reset-enable: false
        url-pattern: /druid/*
      test-on-borrow: false
      test-on-return: false
      test-while-idle: true
      time-between-eviction-runs-millis: 60000
      # 数据库连接 URL：使用环境变量覆盖，默认连接本地 MySQL 3306 端口
      # 下载项目后，如果使用本地 MySQL，无需修改任何配置即可运行
      # 如需修改，设置环境变量 DB_HOST、DB_PORT、DB_NAME 或直接修改这里的默认值
      url: "jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:smart_restaurant}?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_general_ci"
      username: root
      validation-query: SELECT 1

  # RabbitMQ 消息队列配置
  rabbitmq:
    host: 127.0.0.1
    port: 5672
    username: guest
    password: guest
    virtual-host: /
    listener:
      simple:
        concurrency: 3
        max-concurrency: 10
        prefetch: 5
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000

# MyBatis 配置
mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.iwe3.sec.entity
  configuration:
    map-underscore-to-camel-case: true

# PageHelper 分页插件
pagehelper:
  helper-dialect: mysql
  reasonable: true
  support-methods-arguments: true

# SpringDoc OpenAPI
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

# JWT 配置
jwt:
  secret: ${JWT_SECRET:smart-restaurant-secret-key-please-change-in-production-2026}
  access-token-expire: 7200000
  refresh-token-expire: 1209600000

# 日志配置
logging:
  config: classpath:logback.xml
  level:
    com.iwe3.sec: info
    org.springframework: warn
  file:
    path: /logs/portal

# Redisson 单机配置（开发环境使用本地 Redis，未设置密码）
redisson:
  single-server-config:
    address: "redis://127.0.0.1:6379"
    password:
    database: 0
    timeout: 5000
    retry-attempts: 3
    retry-interval: 1000

# Actuator 健康检查与监控
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
