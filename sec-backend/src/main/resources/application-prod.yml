# ============================================================
# 生产环境配置
# 用于 Docker 部署，使用环境变量注入敏感信息
# 注意：数据库、Redis、RabbitMQ 连接信息通过 docker-compose.yml
# 中的 environment 注入，无需在此处重复配置
# ============================================================

# 日志配置：生产环境只输出 info 及以上级别，避免日志刷屏
logging:
  level:
    com.iwe3.sec: info
    org.springframework: warn

# 生产环境关闭 MyBatis SQL 日志打印
mybatis:
  configuration:
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
