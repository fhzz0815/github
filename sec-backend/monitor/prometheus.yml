global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files:
  - "alert-rules.yml"

scrape_configs:
  - job_name: "spring-boot"
    metrics_path: "/smart_restaurant/actuator/prometheus"
    static_configs:
      - targets: ["backend1:8080", "backend2:8080"]
        labels:
          service: "sec-backend"

  - job_name: "mysql"
    static_configs:
      - targets: ["mysql-exporter:9104"]

  - job_name: "redis"
    static_configs:
      - targets: ["redis-exporter:9121"]

  - job_name: "nginx"
    static_configs:
      - targets: ["nginx-exporter:9113"]

  - job_name: "rabbitmq"
    static_configs:
      - targets: ["rabbitmq:15692"]