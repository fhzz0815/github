groups:
  - name: smart-restaurant
    rules:
      - alert: HighErrorRate
        expr: rate(http_requests_seconds_count{status=~"5.."}[5m]) / rate(http_requests_seconds_count[5m]) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "接口错误率超过 5%"
          description: "过去 5 分钟错误率为 {{ $value | humanizePercentage }}"

      - alert: SlowResponse
        expr: histogram_quantile(0.99, rate(http_server_requests_seconds_bucket[5m])) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "P99 响应时间超过 2 秒"
          description: "当前 P99 = {{ $value }}s"

      - alert: QueueBacklog
        expr: rabbitmq_queue_messages > 1000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "消息队列积压超过 1000"
          description: "当前积压: {{ $value }} 条"

      - alert: MySQLReplicationLag
        expr: mysql_slave_status_seconds_behind_master > 10
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "MySQL 主从延迟超过 10 秒"
          description: "当前延迟: {{ $value }}s"

      - alert: RedisMemoryUsage
        expr: redis_memory_used_bytes / redis_memory_max_bytes > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Redis 内存使用率超过 80%"
          description: "当前使用率: {{ $value | humanizePercentage }}"