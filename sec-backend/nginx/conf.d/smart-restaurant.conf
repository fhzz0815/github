upstream backend_cluster {
    server backend1:8080 max_fails=3 fail_timeout=10s;
    server backend2:8080 max_fails=3 fail_timeout=10s;
}

server {
    listen 80;
    server_name localhost;
    client_max_body_size 50m;
    charset utf-8;

    # 前端静态资源
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # 后端 API 反向代理
    location /smart_restaurant/ {
        proxy_pass http://backend_cluster;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
        proxy_send_timeout 30s;
        proxy_buffering off;
        proxy_cache_bypass $http_upgrade;

        # WebSocket 支持
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Druid 监控
    location /druid/ {
        proxy_pass http://backend_cluster/druid/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 健康检查
    location /health {
        proxy_pass http://backend_cluster/smart_restaurant/actuator/health;
        proxy_set_header Host $host;
        access_log off;
    }

    # 错误页面
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}