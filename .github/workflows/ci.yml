# ============================================================
# 智能餐厅系统 - CI/CD 流水线
# 功能：自动构建、测试、打包
# 触发条件：推送到 main 分支 或 创建 Pull Request
# ============================================================
name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
    paths-ignore:
      - '**.md'
      - '.github/**'
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # 支持手动触发

jobs:
  # ==================== 后端构建与测试 ====================
  backend-build:
    name: Backend Build & Test
    runs-on: ubuntu-latest

    services:
      # MySQL 服务容器
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test123
          MYSQL_DATABASE: smart_restaurant
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping -h localhost" --health-interval=10s --health-timeout=5s --health-retries=5

      # Redis 服务容器
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=5

      # RabbitMQ 服务容器
      rabbitmq:
        image: rabbitmq:3.13-alpine
        ports:
          - 5672:5672
        options: --health-cmd="rabbitmq-diagnostics check_port_connectivity" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: 初始化数据库
        run: |
          mysql -h 127.0.0.1 -u root -ptest123 smart_restaurant < sql/init.sql
        working-directory: sec-backend

      - name: 编译并运行测试
        run: mvn clean test -q
        working-directory: sec-backend

      - name: 打包 Jar
        run: mvn clean package -DskipTests -q
        working-directory: sec-backend

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: sec-backend/target/sec-backend.jar
          retention-days: 7

  # ==================== 前端构建 ====================
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: sec-frontend/package-lock.json

      - name: 安装依赖
        run: npm ci
        working-directory: sec-frontend

      - name: 构建前端
        run: npm run build
        working-directory: sec-frontend

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: sec-frontend/dist
          retention-days: 7
